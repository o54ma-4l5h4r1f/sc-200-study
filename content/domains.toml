# SC-200 skills-measured outline -- the backbone of the whole system.
# Source (study guide): https://learn.microsoft.com/credentials/certifications/resources/study-guides/sc-200
# Source (cert page):    https://learn.microsoft.com/credentials/certifications/security-operations-analyst/
#
# Exam: SC-200 "Microsoft Security Operations Analyst"
#   -> Microsoft Certified: Security Operations Analyst Associate
#
# OUTLINE VERSION captured: "Skills measured as of October 21, 2026".
# Captured 2026-11-12 via the Microsoft Learn MCP (microsoft_docs_fetch of the live study guide).
# Bullet text below is VERBATIM -- do not paraphrase. Question generation and the freshness diff
# both depend on exact wording.
#
# `prior_cert` values: none | partial | strong  -- the learner is a FULL BEGINNER (see the README
#   "THE LEARNER"), so everything starts at "none".
# `hours` is the planned study allocation per bullet, weighted by exam weight x difficulty.
#   Objective hours sum to 126 h. total_planned_hours (160) also counts the Foundations
#   primers (~16 h, week 1) and mock exams / weak-area patching (~18 h, week 4).
# `week` is the 4-week study-plan slot (see progress/study-plan.md).
# `license_blocked = true` = needs Microsoft 365 E5 / Defender / Entra ID P2 / Purview licences the
#   learner's Azure-subscription-only lab does not have -> portal tour + docs, no live lab.
#   Initial guess per bullet; objective writers confirm against the docs and report corrections.
# `high_risk` = heavy weight or highly confusable (automation rule vs playbook, AMA/DCR, retention
#   tiers, analytics rule types, KQL).

