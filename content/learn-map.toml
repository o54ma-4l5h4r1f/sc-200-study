# SC-200 official Microsoft Learn training map.
#
# The join between the skills-measured outline (content/domains.toml) and the official training
# curriculum. Each unit maps to the blueprint bullet(s) it serves. The mismatches matter: bullets with
# no unit are written from product docs, off-blueprint units are Skip-section material.
#
# CAPTURED 2026-11-12 via the Microsoft Learn MCP (microsoft_docs_fetch): all 10 SC-200 learning
# paths, 59 modules, 447 units. Every module page was fetched for its live unit list and
# Microsoft's real unit slugs; spot-checked unit bodies where a newer bullet might be carried
# (advanced hunting, configure logs, Defender portal settings, Windows hosts planning, DCR, notebooks).
# Blueprint = "Skills measured as of October 21, 2026" (54 bullets).
#
# MISMATCHES (the reason this file exists):
#
#   Bullets with NO training unit (9) -> write entirely from product docs:
#     D1.1.5
#     D1.1.8
#     D1.2.4
#     D1.3.7
#     D2.1.10
#     D2.2.4
#     D2.3.3
#     D3.2.2
#     D3.2.3
#
#   Bullets carried by a SINGLE unit (9) -> thin; supplement from docs:
#     D1.2.1  <- create-manage-azure-sentinel-workspaces#5
#     D1.3.3  <- connect-windows-hosts-to-azure-sentinel#2
#     D1.3.5  <- connect-microsoft-services-to-azure-sentinel#6
#     D1.4.1  <- mitigate-incidents-microsoft-365-defender#8
#     D1.4.2  <- mitigate-incidents-microsoft-365-defender#8
#     D1.4.4  <- what-is-threat-hunting-azure-sentinel#4 (slug 3a-explore-mitre-att-ck)
#     D3.1.4  <- mitigate-incidents-microsoft-365-defender#11
#     D3.1.5  <- mitigate-incidents-microsoft-365-defender#8
#     D3.1.6  <- mitigate-incidents-microsoft-365-defender#8
#
#   Off-blueprint units: 64 (off_blueprint = true; Skip-section fuel). Whole modules that are
#   off-blueprint: vulnerability management, Defender for Cloud onboarding (Azure + non-Azure),
#   CSPM, watchlists, and the generative-AI fundamentals module (exam_native = false).
#   license_blocked exercise units: 4 (Entra ID P2 / Microsoft 365 E5 Purview).
#
#   Partial coverage worth knowing (bullet is mapped, but the newest half of it is NOT taught):
#     D3.2.4  notebooks taught (Kqlmagic/msticpy) - Sentinel MCP Server connection is docs-only.
#     D1.2.2  tiers taught in configure-logs; KQL jobs / summary rules only named in passing.
#     D3.1.5/D3.1.6  only the Hunting graph (Preview) section of one advanced-hunting unit.
#     D1.3.3  WEF/WEC is one paragraph in the Windows hosts planning unit.
#     D2.1.10 Purview IRM 'cases' exist in P2 but are NOT Defender case management.
#
# kind: intro | concept | exercise | assessment | summary   (only concept/exercise "teach")
# `n` is this map's own contiguous 1..N index per module (build.py validates contiguity); the slug
# keeps Microsoft's real unit slug even where their published numbering has gaps or letters (2a, 8a).
# off_blueprint = true: teaches something the exam never asks for. license_blocked = true: exercise
# needs a licence the learner lacks (Azure subscription only).
#
# Regenerate/verify with:  python3 build.py --check-learn-map

schema_version = 1
captured = 2026-11-12
unit_total = 447

